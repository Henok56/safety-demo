[build]
  base = "front"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirect API calls to your Vercel backend
[[redirects]]
  from = "/api/*"
  to = "https://safety-backend.vercel.app/api/:splat"
  status = 200
  force = true

# Handle SPA routing (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
